<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PWA 安裝檢查</title><body style="font:16px system-ui;padding:20px;max-width:680px;margin:auto"><h1>呈盛大板 3D｜PWA 安裝檢查</h1><p>此頁用來檢查部署後安裝條件。請從 GitHub Pages 的 HTTPS 網址開啟。</p><pre id="out">檢查中…</pre><script>(async()=>{const out=document.querySelector('#out');const data={protocol:location.protocol,href:location.href,standalone:matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,serviceWorkerSupported:'serviceWorker'in navigator,manifestLink:document.querySelector('link[rel=manifest]')?.href||null};try{const r=await fetch('./manifest.webmanifest',{cache:'no-store'});data.manifestHTTP=r.status;data.manifest=await r.json()}catch(e){data.manifestError=String(e)}try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();data.serviceWorkers=regs.map(r=>({scope:r.scope,active:!!r.active,scriptURL:r.active?.scriptURL}))}}catch(e){data.swError=String(e)}out.textContent=JSON.stringify(data,null,2)})()</script><p><a href="./index.html">返回首頁</a></p></body></html>
